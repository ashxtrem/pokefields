<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build Ideas · Companion concept</title>
<style>
:root{font:15px/1.6 'Trebuchet MS',Arial,sans-serif;color:#263d31;background:#faf9f5;--green:#28533f;--muted:#59695d;--line:#d6ddcf;--paper:#faf9f5}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #966014;outline-offset:4px}::selection{background:#c8dcba}a{color:var(--green);text-underline-offset:4px}button{border:1px solid #b4c1b1;border-radius:9px;background:transparent;padding:10px 17px;min-height:44px}button:hover:not(:disabled){background:#e9eedf}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover:not(:disabled){background:#193d2c}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,serif;font-weight:400;line-height:1.2}h1{font-size:44px;letter-spacing:-1.2px}h2{font-size:28px}h3{font-size:16px}p{margin:12px 0;color:var(--muted);max-width:68ch}small{font-size:12px}.banner{background:#e9e6d9;text-align:center;padding:9px 18px;font-size:12px;color:#544a33}header{display:flex;align-items:center;justify-content:space-between;padding:22px 5%;border-bottom:1px solid var(--line)}.brand{font:22px Georgia,serif}.brand span{color:#64765d}.shell{max-width:1160px;margin:auto;padding:32px 30px 70px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:36px}.steps button{border:0;color:var(--muted)}.steps button[aria-current=step]{background:#e2ebdc;color:#263d31;font-weight:bold}.steps b{display:inline-grid;place-items:center;border:1px solid #91a288;width:25px;height:25px;border-radius:50%;margin-right:7px}.intro{margin-bottom:28px}.roster{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.pokemon{display:flex;align-items:center;gap:12px;min-width:155px;background:#fffdf8}.pokemon[aria-pressed=true]{border:2px solid var(--green);background:#edf2e6;padding:9px 16px}.monogram{font:24px Georgia,serif;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#e4ddc9}.pokemon small{display:block;text-align:left;color:var(--muted)}.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(290px,1fr);gap:38px;align-items:start}.board{background:#eaf0e1;border:1px solid #bdcbb4;border-radius:14px;padding:22px}.boardhead{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;color:#43573b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:#c5d1ba;border:2px solid #c5d1ba;aspect-ratio:1}.cell{border:0;border-radius:0;background:#eff3e8;min-width:0;min-height:0;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}.cell.empty{background:#e7eddf}.cell.flower{background:#dbe8cc}.cell.seat{background:#e9d8b7}.cell.fire{background:#edd6b7}.cell svg{width:32px;height:32px}.cell[aria-pressed=true]{outline:3px solid #28533f;outline-offset:-3px;background:#d0dfc2}.boardfoot{font-size:12px;margin-top:12px;color:#4b6043}.badge{display:inline-block;font-size:12px;background:#eee4c9;color:#5d491e;padding:3px 9px;border-radius:20px;margin:12px 0}.summary{padding:5px 0}.facts{display:flex;gap:24px;border-block:1px solid var(--line);margin:22px 0;padding:14px 0}.facts b{display:block}.facts span{font-size:13px;color:var(--muted)}.why{padding-left:20px;color:var(--muted)}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:24px}.textbtn{padding:5px 0;border:0;text-decoration:underline;text-underline-offset:4px}.itemrow{padding:15px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}.itemrow button{border:0;text-align:left;padding:4px 0}.itemrow small{display:block;color:var(--muted)}.num{font-variant-numeric:tabular-nums}.detailbox{padding:17px 0;border-top:1px solid var(--line);margin-top:22px}.subnav{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px}.quantity{display:flex;align-items:center;gap:8px}.quantity input{width:65px;text-align:center;padding:8px;border:1px solid #9cad99;border-radius:8px;background:#fffdf8}.quantity button{padding:7px 12px}.progress{height:7px;background:#dce4d5;border-radius:8px;overflow:hidden;margin:16px 0}.progress div{height:100%;background:var(--green)}.location{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}label{display:block;margin-bottom:8px}select{background:#fffdf8;padding:12px;border:1px solid #a2b29b;border-radius:8px;width:100%;max-width:390px}.note{font-size:13px}.error{color:#8c3428}.status{padding-top:12px;color:var(--green)}details{margin-top:25px;border-top:1px solid var(--line);padding-top:15px}summary{cursor:pointer;color:var(--green)}footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--muted)}[hidden]{display:none!important} @media(max-width:720px){header{padding:17px 20px}.brand{font-size:19px}.shell{padding:22px 18px 45px}.steps{gap:0;margin-bottom:25px}.steps button{padding:8px;font-size:13px}.steps b{margin-right:5px}h1{font-size:35px}.split{grid-template-columns:1fr;gap:24px}.board{padding:15px}.roster{gap:8px}.pokemon{min-width:140px;flex:1}.cell{font-size:10px}.cell svg{width:26px;height:26px}.quantity{gap:4px}.quantity input{width:48px}.quantity button{padding:7px 10px}.itemrow{gap:8px}footer{flex-direction:column;gap:8px}}@media(prefers-reduced-motion:no-preference){.screen{animation:arrive .2s ease-out}@keyframes arrive{from{opacity:.85;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
<div class="banner">Interactive concept · Catalog-backed items, illustrative layout · Not yet verified in-game</div>
<header><div class="brand">Pokopia <span>Fieldnotes</span></div><span>Build Ideas</span></header>
<main class="shell"><nav class="steps" aria-label="Build guide steps"></nav><div id="screen"></div><p id="storageError" class="error" role="status" hidden></p><footer><span>Demo progress stays in this browser, separate from your notebook.</span><button class="textbtn" id="reset">Reset demo</button></footer></main>
<script src="sample-data.js"></script><script>
const R=window.BUILD_SAMPLE,P=window.POKEMON_SAMPLE,KEY='build-ideas-prototype-v1';
let state={step:0,selected:['eevee','combee'],saved:false,counts:{},region:'',built:false},chosen='wildflowers',notice='';
try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&v.version===1){state={...state,selected:Array.isArray(v.selected)?v.selected.filter(x=>P.some(p=>p.id===x)):state.selected,saved:v.saved===true,counts:Object.fromEntries(R.billOfItems.map(i=>[i.itemId,Number.isInteger(v.counts?.[i.itemId])?Math.min(i.quantity,Math.max(0,v.counts[i.itemId])):0])),region:typeof v.region==='string'?v.region:'',built:v.built===true};}}catch(e){notice='Saved demo could not be read. You can continue with a fresh copy.'}
function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,version:1,templateVersion:R.version}));}catch(e){notice='Browser storage is unavailable. Your changes will last only for this visit.'}document.querySelector('#storageError').hidden=!notice;document.querySelector('#storageError').textContent=notice}
const icon=t=>({wildflowers:'<circle cx="16" cy="10" r="6"/><path d="M16 16v13m0-6-7-5m7 7 8-5"/>',plainstool:'<rect x="6" y="8" width="22" height="10" rx="3"/><path d="M9 18v10m16-10v10"/>',campfire:'<path d="M17 3c2 8 9 10 7 17-2 8-15 6-15-1 0-4 5-6 8-16Z"/><path d="m5 28 24 3M29 27 5 31"/>'}[t]);
function board(){return `<div class="board"><div class="boardhead"><b>Top-down layout</b><span>5 × 5 · one level</span></div><div class="grid" aria-label="Illustrative 5 by 5 layout">${Array.from({length:25},(_,n)=>{let x=n%5,y=Math.floor(n/5),o=R.placements.find(o=>o.x===x&&o.y===y);return o?`<button class="cell ${o.itemId==='wildflowers'?'flower':o.itemId==='campfire'?'fire':'seat'}" data-item="${o.itemId}" aria-label="${R.items.find(i=>i.id===o.itemId).name}, column ${x+1}, row ${y+1}" aria-pressed="${chosen===o.itemId}"><svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">${icon(o.itemId)}</svg><span>${o.itemId==='wildflowers'?'Flowers':o.itemId==='campfire'?'Campfire':'Stool'}</span></button>`:'<div class="cell empty" aria-hidden="true"></div>'}).join('')}</div><div class="boardfoot">Tap an object to inspect it. Positions and one-cell footprints are illustrative.</div></div>`}
function reasons(){let lines=[];for(let p of P.filter(p=>state.selected.includes(p.id))){let matches=R.items.flatMap(i=>i.categories.filter(c=>p.favorites.includes(c)).map(c=>`${i.name}: ${c.toLowerCase()}`));lines.push(`<li><b>${p.name}</b> — ${matches.join('; ')||'no recorded preference match'}.</li>`)}return lines.join('')}
function evidence(){return `<details><summary>Sources & review status</summary><p class="note">Original companion demo, not a copied player build. Item identities and preference categories come from our catalog. Placement, footprints, and in-game recreation still need review.</p><p class="note"><a href="${R.sources[0].url}" target="_blank" rel="noopener">Serebii: Pretty flower bed requirements</a> supports four Wildflowers, not this full layout or a shared home.</p><p class="note"><a href="${R.candidateSource.url}" target="_blank" rel="noopener">Explore the creator’s 5×5 gallery</a> · <a href="${R.candidateSource.playlistUrl}" target="_blank" rel="noopener">Tutorial playlist</a>. This is a candidate for future extraction; no specific tutorial has been mapped yet.</p><p class="note"><a href="sample-build.json" target="_blank">Inspect the sample record</a></p></details>`}
function go(n){state.step=n;save();render();window.scrollTo(0,0);document.querySelector('h1').focus()}
function render(){document.querySelector('.steps').innerHTML=['Choose Pokémon','Inspect build','Gather items'].map((t,i)=>`<button data-step="${i}" aria-current="${state.step===i?'step':'false'}" ${i>0&&!state.selected.length||i===2&&!state.saved?'disabled':''}><b>${i+1}</b>${t}</button>`).join('');let html='';
if(state.step===0)html=`<section class="screen"><div class="intro"><h1 tabindex="-1">A little place for your Pokémon.</h1><p>Choose a group, then find a build with items they like. This concept has one sample to explore.</p></div><div class="roster">${P.map(p=>`<button class="pokemon" data-mon="${p.id}" aria-pressed="${state.selected.includes(p.id)}"><span class="monogram">${p.name.slice(0,1)}</span><span>${p.name}<small>${state.selected.includes(p.id)?'Selected':'Add to group'}</small></span></button>`).join('')}</div>${!state.selected.length?'<p role="status">Select at least one Pokémon to see a build idea.</p>':`<div class="split">${board()}<div class="summary"><h2>Flower camp</h2><span class="badge">Demo template · review pending</span><p>A small flower patch, two stools, and a campfire on existing level ground.</p><div class="facts"><div><b>5 × 5</b><span>Demo plot</span></div><div><b>7 objects</b><span>3 item types</span></div></div><h3>Why these items?</h3><ul class="why">${reasons()}</ul><p class="note">Preference matches are suggestions, not a comfort score or housing guarantee.</p><button class="primary" id="inspect">Inspect sample build</button></div></div>`}</section>`;
if(state.step===1){let item=R.items.find(i=>i.id===chosen),q=R.billOfItems.find(i=>i.itemId===chosen).quantity;html=`<section class="screen"><div class="subnav"><button class="textbtn" data-step="0">Back to Pokémon</button><span>Original companion concept</span></div><div class="intro"><h1 tabindex="-1">Flower camp</h1><p>Read the layout, check the items, then save a demo gathering list.</p></div><div class="split">${board()}<div><h2>What goes into it</h2><span class="badge">Layout awaiting in-game review</span>${R.billOfItems.map(i=>`<div class="itemrow"><button data-item="${i.itemId}"><b>${R.items.find(x=>x.id===i.itemId).name}</b><small>Highlight on the layout</small></button><b class="num">× ${i.quantity}</b></div>`).join('')}<div class="detailbox" aria-live="polite"><h3>${item.name} · ${q} placed</h3><p class="note">${item.categories.join(' · ')}</p><a href="${item.source}" target="_blank" rel="noopener">View item source</a></div><div class="actions"><button class="primary" id="save">${state.saved?'Open gathering list':'Save demo & gather'}</button></div><p class="note">Existing ground is assumed. No terrain blocks or raw crafting totals are included.</p></div></div>${evidence()}</section>`}
if(state.step===2){let total=R.billOfItems.reduce((a,i)=>a+(state.counts[i.itemId]||0),0),ready=total===7;html=`<section class="screen"><div class="subnav"><button class="textbtn" data-step="1">Back to layout</button><span>Saved demo · version 1</span></div><div class="intro"><h1 tabindex="-1">Gather for Flower camp.</h1><p>Count finished items set aside for this plan. Your notebook inventory is unaffected.</p></div><div class="split"><div><h2>${total} of 7 items ready</h2><div class="progress" role="progressbar" aria-label="Gathered items" aria-valuemin="0" aria-valuemax="7" aria-valuenow="${total}"><div style="width:${total/7*100}%"></div></div>${R.billOfItems.map(i=>{let v=state.counts[i.itemId]||0;return `<div class="itemrow"><div><b>${R.items.find(x=>x.id===i.itemId).name}</b><small class="num">${v} / ${i.quantity} · ${v===i.quantity?'Ready':`Need ${i.quantity-v} more`}</small></div><div class="quantity"><button data-count="${i.itemId}" data-delta="-1" aria-label="One fewer ${i.itemId}" ${v===0?'disabled':''}>−</button><input type="number" min="0" max="${i.quantity}" step="1" inputmode="numeric" value="${v}" data-quantity="${i.itemId}" aria-label="${R.items.find(x=>x.id===i.itemId).name} gathered"><button data-count="${i.itemId}" data-delta="1" aria-label="One more ${i.itemId}" ${v===i.quantity?'disabled':''}>+</button></div></div>`}).join('')}<div class="location"><h3>${state.built?'Demo completion saved':'After you build it'}</h3><p class="note">${state.built?'This records your demo action; it does not verify the layout.':'Gathering everything does not mean the build is complete.'}</p><label for="region">Built location</label><select id="region"><option value="">Choose a location</option>${['Withered Wastelands','Bleak Beach','Rocky Ridges','Sparkling Skylands','Palette Town','Cloud Island'].map(x=>`<option ${state.region===x?'selected':''}>${x}</option>`).join('')}</select><div class="actions"><button id="built" class="primary" ${!state.region||state.built?'disabled':''}>Record demo as built</button>${state.built?'<button id="undo">Undo completion</button>':''}</div><p class="note">${ready?'All items gathered.':'You can record completion even if you did not track every item.'} A location is required.</p></div></div><div>${board()}<p class="note">This is still an illustrative template. Recording completion does not change its review status.</p><a href="${R.sources[0].url}" target="_blank" rel="noopener">Read the habitat source</a></div></div></section>`}document.querySelector('#screen').innerHTML=html;save()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.step!==undefined)return go(+b.dataset.step);if(b.dataset.mon){state.selected=state.selected.includes(b.dataset.mon)?state.selected.filter(x=>x!==b.dataset.mon):[...state.selected,b.dataset.mon];save();render()}if(b.dataset.item){chosen=b.dataset.item;if(state.step!==1){go(1);return}render();document.querySelector(`[data-item="${chosen}"]`)?.focus()}if(b.id==='inspect')go(1);if(b.id==='save'){state.saved=true;go(2)}if(b.dataset.count){let i=R.billOfItems.find(i=>i.itemId===b.dataset.count);state.counts[i.itemId]=Math.min(i.quantity,Math.max(0,(state.counts[i.itemId]||0)+ +b.dataset.delta));save();render();document.querySelector(`[data-count="${i.itemId}"][data-delta="${b.dataset.delta}"]`)?.focus()}if(b.id==='built'){state.built=true;save();render()}if(b.id==='undo'){state.built=false;save();render()}if(b.id==='reset'){state={step:0,selected:['eevee','combee'],saved:false,counts:{},region:'',built:false};go(0)}});
document.addEventListener('input',e=>{if(!e.target.dataset.quantity||e.target.value==='')return;let i=R.billOfItems.find(i=>i.itemId===e.target.dataset.quantity),n=Number(e.target.value);if(!Number.isInteger(n)||n<0||n>i.quantity)return;state.counts[i.itemId]=n;save();let total=R.billOfItems.reduce((a,i)=>a+(state.counts[i.itemId]||0),0);document.querySelector('#screen h2').textContent=total+' of 7 items ready';let bar=document.querySelector('.progress');bar.setAttribute('aria-valuenow',total);bar.firstElementChild.style.width=total/7*100+'%';e.target.closest('.itemrow').querySelector('small').textContent=n+' / '+i.quantity+' · '+(n===i.quantity?'Ready':'Need '+(i.quantity-n)+' more');for(let b of e.target.closest('.quantity').querySelectorAll('button'))b.disabled=b.dataset.delta==='1'?n===i.quantity:n===0;});
document.addEventListener('change',e=>{if(e.target.id==='region'){state.region=e.target.value;save();render();document.querySelector('#region').focus()}if(e.target.dataset.quantity){let i=R.billOfItems.find(i=>i.itemId===e.target.dataset.quantity),n=Number(e.target.value);state.counts[i.itemId]=Number.isFinite(n)?Math.min(i.quantity,Math.max(0,Math.floor(n))):0;save();render();document.querySelector(`[data-quantity="${i.itemId}"]`)?.focus()}});render();
</script></html>
